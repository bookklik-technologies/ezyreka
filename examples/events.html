<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ezyreka - Events</title>
  <style>
    html, body { margin: 0; height: 100%; }
    #app { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="../dist/ezyreka.umd.js"></script>
  <script>
    // The editor emits ready, change and selection events.
    const { Editor } = Ezyreka;

    const editor = new Editor({
      target: '#app',
      width: 1080,
      height: 1080,
      name: 'Events demo'
    });

    const log = (name, detail) => console.log(`ezyreka:${name}`, detail ?? '');

    editor.on('ready', () => {
      log('ready');
      editor.addText({
        text: 'Hello Ezyreka',
        fontSize: 96,
        fontWeight: 800,
        align: 'center',
        x: 90,
        y: 420,
        w: 900,
        h: 140,
        color: '#FACC15'
      });
    });
    editor.on('change', ({ doc }) => log('change', `${doc.pages[0].elements.length} elements`));
    editor.on('selection', (selected) => log('selection', selected.map((e) => e.type)));

    window.editor = editor;
  </script>
</body>
</html>
